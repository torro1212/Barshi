name: Fetch Israel HT data

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'API-Football key'
        required: true
      seasons:
        description: 'Comma-separated season start years'
        required: false
        default: '2021,2022,2023,2024,2025'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Ligat Ha'al seasons
        working-directory: ht-draw-analyst
        run: npx --yes tsx scripts/fetch-israel.ts --key "${{ github.event.inputs.api_key }}" --seasons "${{ github.event.inputs.seasons }}" --out data-israel
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ht-draw-analyst/data-israel
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Add Ligat Ha'al historical data (API-Football)"
          git push
