name: Fetch Israel HT data

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'API-Football key'
        required: true
      seasons:
        description: 'Comma-separated season start years'
        required: false
        default: '2021,2022,2023,2024,2025'
      mode:
        description: 'fetch or probe (identify which service the key belongs to)'
        required: false
        default: 'fetch'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # the key is exposed to the job only via env so it never appears in
    # step logs (public repo: logs are public, repo files are public)
    env:
      API_FOOTBALL_KEY: ${{ github.event.inputs.api_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch data
        working-directory: ht-draw-analyst
        run: |
          if [ "${{ github.event.inputs.mode }}" = "probe" ]; then
            npx --yes tsx scripts/probe-key.ts
          elif [ "${{ github.event.inputs.mode }}" = "odds" ]; then
            npx --yes tsx scripts/fetch-odds.ts --out odds-log
          else
            npx --yes tsx scripts/fetch-israel.ts --seasons "${{ github.event.inputs.seasons }}" --out data-israel
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- ht-draw-analyst/data-israel ht-draw-analyst/odds-log 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Update fetched data (API-Football)"
          git push
